name: Deploy dev

# Builds the dev site and deploys it to the playtested-dev Worker.
# Runs on every push to `dev` — including studio publishes, which commit
# there — and on demand (the studio's "Rebuild now", and the Worker's
# scheduler when a scheduled post becomes due).

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deploy was started
        required: false
        default: manual

# One deploy at a time; a newer push waits rather than cancelling a build
# that's already uploading.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.token.outputs.ready }}
    steps:
      - id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Add the CLOUDFLARE_API_TOKEN repository secret to turn on automatic dev deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3290294832f56e48f5c04f91d5d87634
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Build
        run: node scripts/build.mjs --env dev
      - name: Mirror git content into the studio database
        run: node scripts/sync-d1.mjs
      - name: Deploy
        run: npx wrangler deploy
