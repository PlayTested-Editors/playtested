name: Deploy production

# Builds the production site (playtested.net) and deploys it to the
# `playtested` Worker. Runs on every push to `main` — including studio
# publishes, which commit there — and on demand (the studio's "Rebuild now",
# and the Worker's scheduler when a scheduled post becomes due).
# Uses wrangler.production.jsonc; dev keeps wrangler.jsonc.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deploy was started
        required: false
        default: manual

# One deploy at a time; a newer push waits rather than cancelling a build
# that's already uploading.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.token.outputs.ready }}
    steps:
      - id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Add the CLOUDFLARE_API_TOKEN repository secret to turn on automatic production deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3290294832f56e48f5c04f91d5d87634
      WRANGLER_CONFIG: wrangler.production.jsonc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.production.jsonc
      - name: Build
        run: node scripts/build.mjs --env production
        # Ad unit IDs are public (they appear in every page), so they live here
        # rather than in secrets. Adsterra IDs need replacing: see P7.
        env:
          PUBLIC_ADSENSE_ENABLED: "true"
          PUBLIC_ADSENSE_CLIENT_ID: ca-pub-1881206716454045
          PUBLIC_ADSENSE_ARTICLE_UNIT_ID: "4753902993"
          PUBLIC_ADSENSE_FOOTER_UNIT_ID: "6294941726"
          PUBLIC_ADSTERRA_ENABLED: "true"
          PUBLIC_ADSTERRA_NATIVE_ID: 7541489fe8c59309ca2df0c4a8388020
          PUBLIC_ADSTERRA_FOOTER_ID: ce707fdce55ed67d4b822f07899b7bee
          PUBLIC_ADSTERRA_SOCIAL_ID: d27a9df3900fb493846123cd1814822f
          PUBLIC_ADSTERRA_POPUNDER_ID: ""
      - name: Mirror git content into the studio database
        run: node scripts/sync-d1.mjs
      - name: Deploy
        run: npx wrangler deploy --config wrangler.production.jsonc
