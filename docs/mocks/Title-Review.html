ags":[]}]</script>
<script>
(() => {
  const ROWS = JSON.parse(document.getElementById("data").textContent);
  const KEY = "playtested-title-review-v1";
  const PAGE = 40;
  let picks = {};
  try { picks = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(picks)); } catch {} renderStats(); };
  const $ = (s) => document.querySelector(s);
  let page = 0;

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const show = (t) => { const [h, ...rest] = t.split(" | "); return `${esc(h)}${rest.length ? ` <span class="second">| ${esc(rest.join(" | "))}</span>` : ""}`; };
  const headLen = (t) => t.split(" | ")[0].length;
  const chosen = (r) => { const p = picks[r.id]; if (!p) return null; return p.kind === "custom" ? p.text : r[p.kind]; };

  function visible() {
    const q = $("#q").value.trim().toLowerCase();
    const f = $("#filter").value;
    return ROWS.filter((r) => {
      if (q && !(`${r.original} ${r.minimal} ${r.punchy}`.toLowerCase().includes(q))) return false;
      if (f === "undecided") return !picks[r.id];
      if (f === "decided") return Boolean(picks[r.id]);
      if (f === "long") return r.headline.length > 60;
      if (f === "flagged") return r.flags.length > 0;
      return true;
    });
  }

  function render() {
    const rows = visible();
    const pages = Math.max(1, Math.ceil(rows.length / PAGE));
    page = Math.min(page, pages - 1);
    const slice = rows.slice(page * PAGE, page * PAGE + PAGE);
    $("#list").innerHTML = slice.map((r) => {
      const p = picks[r.id];
      const opt = (kind, label, text) => `
        <label class="opt ${p?.kind === kind ? "on" : ""}">
          <input type="radio" name="r${r.id}" value="${kind}" ${p?.kind === kind ? "checked" : ""} />
          <span class="k">${label}</span>
          <span class="t">${show(text)}</span>
          <span class="n ${headLen(text) > 60 ? "long" : ""}">${headLen(text)} chars</span>
        </label>`;
      const same = r.punchy === r.minimal;
      return `<div class="card ${p ? "done" : ""}" data-id="${r.id}">
        <div class="meta"><span>${esc(r.date)}</span><span>${esc(r.file.replace("src/content/article/", ""))}</span>${r.flags.map((f) => `<span class="flag">${esc(f)}</span>`).join("")}<span class="orig">Original: ${esc(r.original)}</span></div>
        ${opt("minimal", "Minimal", r.minimal)}
        ${same ? "" : opt("punchy", "Punchy", r.punchy)}
        ${opt("original", "Original", r.original)}
        <label class="opt ${p?.kind === "custom" ? "on" : ""}">
          <input type="radio" name="r${r.id}" value="custom" ${p?.kind === "custom" ? "checked" : ""} />
          <span class="k">Your own</span>
          <input class="field custom" data-custom="${r.id}" value="${esc(p?.kind === "custom" ? p.text : (r.punchy || r.minimal))}" />
          <span class="n"></span>
        </label>
      </div>`;
    }).join("") || `<p class="note">Nothing matches.</p>`;
    $("#pageInfo").textContent = `Page ${page + 1} of ${pages} · ${rows.length} titles`;
    $("#prev").disabled = page === 0;
    $("#next").disabled = page >= pages - 1;
    renderStats();
  }

  function renderStats() {
    const decided = Object.keys(picks).length;
    const count = (k) => Object.values(picks).filter((p) => p.kind === k).length;
    $("#stats").innerHTML = `<span><b>${decided}</b> of ${ROWS.length} decided</span><span>Minimal <b>${count("minimal")}</b></span><span>Punchy <b>${count("punchy")}</b></span><span>Original <b>${count("original")}</b></span><span>Your own <b>${count("custom")}</b></span>`;
  }

  $("#list").addEventListener("change", (e) => {
    const t = e.target;
    const card = t.closest(".card");
    if (!card) return;
    const id = card.dataset.id;
    if (t.type === "radio") {
      picks[id] = t.value === "custom" ? { kind: "custom", text: card.querySelector("[data-custom]").value.trim() } : { kind: t.value };
      card.classList.add("done");
      card.querySelectorAll(".opt").forEach((o) => o.classList.toggle("on", o.contains(t)));
      save();
    }
  });
  $("#list").addEventListener("input", (e) => {
    const t = e.target;
    if (!t.dataset.custom) return;
    const card = t.closest(".card");
    const radio = card.querySelector('input[value="custom"]');
    radio.checked = true;
    card.querySelectorAll(".opt").forEach((o) => o.classList.toggle("on", o.contains(radio)));
    picks[t.dataset.custom] = { kind: "custom", text: t.value.trim() };
    card.classList.add("done");
    save();
  });

  const pageTo = (kind) => {
    const rows = visible().slice(page * PAGE, page * PAGE + PAGE);
    let n = 0;
    for (const r of rows) if (!picks[r.id]) { picks[r.id] = { kind: kind === "punchy" && r.punchy === r.minimal ? "minimal" : kind }; n++; }
    save(); render(); toast(`${n} title${n === 1 ? "" : "s"} set on this page.`);
  };
  $("#pageMinimal").onclick = () => pageTo("minimal");
  $("#pagePunchy").onclick = () => pageTo("punchy");
  $("#prev").onclick = () => { page--; render(); scrollTo(0, 0); };
  $("#next").onclick = () => { page++; render(); scrollTo(0, 0); };
  $("#q").oninput = () => { page = 0; render(); };
  $("#filter").onchange = () => { page = 0; render(); };
  $("#theme").onchange = (e) => { const v = e.target.value; if (v) document.documentElement.setAttribute("data-theme", v); else document.documentElement.removeAttribute("data-theme"); };

  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = "none"), 2500); }

  $("#download").onclick = () => {
    const out = { version: 1, savedAt: new Date().toISOString(), titles: [] };
    for (const r of ROWS) {
      const p = picks[r.id];
      if (!p) continue;
      const title = chosen(r);
      if (!title) continue;
      out.titles.push({ file: r.file, original: r.original, choice: p.kind, title });
    }
    const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "playtested-title-decisions.json";
    a.click();
    toast(`Saved ${out.titles.length} decisions to playtested-title-decisions.json (your Downloads folder).`);
  };

  render();
})();
</script>
